# Host nginx site for Risk Radar -> /etc/nginx/sites-available/riskradar.geoinfobox.com.conf
# The app itself (website + API) runs in Docker on 127.0.0.1:8180 (see
# docker-compose.prod.yml); this only terminates TLS and forwards.
# Certificate: certbot dns-cloudflare (port 80 is not reachable from outside),
# same route as the LMS sites on this server.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name riskradar.geoinfobox.com;

    ssl_certificate     /etc/letsencrypt/live/riskradar.geoinfobox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/riskradar.geoinfobox.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;          # workbook uploads

    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;       # province recompute can take a while
    }
}
