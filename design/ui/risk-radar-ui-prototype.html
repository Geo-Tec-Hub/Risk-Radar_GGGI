<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Risk Radar — UI Prototype v2 (GGGI Demo)</title>
<style>
:root{
  --green:#00563F; --green-2:#0b7a5c; --lime:#8CC63F; --lime-2:#eaf5d9;
  --bg:#f4f6f4; --card:#ffffff; --ink:#1c2b26; --mut:#6b7c74; --line:#e2e8e3;
  --red:#c0392b; --amber:#b7791f; --blue:#2b6cb0;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--ink);font-size:14px}
button{cursor:pointer;font-size:13px}
.hidden{display:none!important}

/* ---------- login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#00563F 0%,#0b7a5c 55%,#8CC63F 130%)}
.login-card{background:#fff;border-radius:14px;padding:34px 40px;width:440px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.logo-badge{width:38px;height:38px;border-radius:10px;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.logo h1{font-size:20px;color:var(--green)}
.login-card .sub{color:var(--mut);margin-bottom:18px;font-size:12.5px;line-height:1.5}
.login-card label{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.login-card input{width:100%;padding:9px 11px;margin:5px 0 12px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.role-btn{border:1.5px solid var(--line);border-radius:10px;padding:10px;background:#fff;text-align:left;transition:.15s}
.role-btn:hover{border-color:var(--green);background:var(--lime-2)}
.role-btn b{display:block;color:var(--green);font-size:13px}
.role-btn span{color:var(--mut);font-size:11px}
.guest-btn{width:100%;margin-top:12px;padding:11px;border-radius:10px;border:none;background:var(--lime);
  color:var(--green);font-weight:800;font-size:13.5px}
.guest-btn:hover{background:#9ed455}
.demo-note{margin-top:12px;font-size:11px;color:var(--mut);text-align:center}

/* ---------- app shell ---------- */
#app{display:flex;min-height:100vh}
.side{width:222px;background:var(--green);color:#dfece7;display:flex;flex-direction:column;flex-shrink:0}
.side .logo{padding:18px 16px 12px;border-bottom:1px solid rgba(255,255,255,.12)}
.side .logo h1{color:#fff;font-size:16px}
.side .logo .logo-badge{background:var(--lime);color:var(--green)}
.side nav{padding:12px 10px;flex:1}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#9dbfb2;padding:10px 8px 4px}
.nav-item{display:flex;gap:9px;align-items:center;width:100%;padding:9px 10px;border-radius:8px;border:none;
  background:transparent;color:#dfece7;font-size:13px;text-align:left;margin:1px 0}
.nav-item:hover{background:rgba(255,255,255,.09)}
.nav-item.active{background:var(--lime);color:var(--green);font-weight:700}
.side .who{padding:14px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px}
.side .who b{display:block;color:#fff}
.side .who button{margin-top:8px;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;
  padding:4px 10px;border-radius:6px;font-size:11px}
.main{flex:1;padding:24px 30px;max-width:1280px}
.crumb{font-size:12px;color:var(--mut);margin-bottom:4px}
.page-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.page-h h2{font-size:21px;color:var(--green)}
.btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:600}
.btn:hover{background:var(--green-2)}
.btn.ghost{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.btn.sm{padding:5px 11px;font-size:12px}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat .v{font-size:26px;font-weight:800;color:var(--green)}
.stat .l{font-size:12px;color:var(--mut);margin-top:2px}
.stat .d{font-size:11px;color:var(--green-2);margin-top:6px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.panel h3{font-size:14.5px;color:var(--green);margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;
  padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
.b-admin{background:#e8e3f5;color:#5b3fa8}.b-data{background:var(--lime-2);color:var(--green)}
.b-expert{background:#e0edf7;color:var(--blue)}.b-comm{background:#fdeedd;color:var(--amber)}
.b-ok{background:var(--lime-2);color:var(--green)}.b-pend{background:#fdeedd;color:var(--amber)}
.b-off{background:#f0f0f0;color:#888}

/* ---------- wizard ---------- */
.steps{display:flex;gap:0;margin-bottom:22px}
.step{flex:1;text-align:center;position:relative;padding-top:30px;font-size:12px;color:var(--mut)}
.step::before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.step::after{content:'';position:absolute;top:13px;left:calc(50% + 15px);width:calc(100% - 30px);height:2px;background:var(--line)}
.step:last-child::after{display:none}
.step.on{color:var(--green);font-weight:700}
.step.on::before{background:var(--green);border-color:var(--green);color:#fff}
.step.done::before{background:var(--lime);border-color:var(--lime);color:var(--green);content:'✓'}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;
  letter-spacing:.05em;margin-bottom:5px}
.field select,.field input,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);
  border-radius:8px;font-size:13px;background:#fff}
.field select:focus,.field input:focus,.field textarea:focus{outline:2px solid var(--lime)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:12.5px}
.pill.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.hint{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.45}

.wsum{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:8px}
.wsum.ok{background:var(--lime-2);color:var(--green)}
.wsum.bad{background:#fbe4e0;color:var(--red)}
.ptable input[type=number]{width:70px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;text-align:right}
.ptable select{padding:5px 7px;border:1px solid var(--line);border-radius:6px}
.del{background:none;border:none;color:var(--red);font-size:15px}
.lock{color:var(--mut);font-size:13px}
.addrow{margin-top:10px;display:flex;gap:8px;align-items:center}
.addrow input{padding:7px 10px;border:1px solid var(--line);border-radius:7px}

.modecards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.modecard{border:2px solid var(--line);border-radius:12px;padding:18px;background:#fff;text-align:left}
.modecard.on{border-color:var(--green);background:var(--lime-2)}
.modecard b{display:block;color:var(--green);font-size:14px;margin-bottom:4px}
.modecard span{font-size:12px;color:var(--mut);line-height:1.5}
.drop{border:2px dashed var(--green);border-radius:12px;padding:30px;text-align:center;color:var(--mut);
  background:#fbfdf9;margin-top:12px}
.drop b{color:var(--green)}
.wnav{display:flex;justify-content:space-between;margin-top:20px}

.rev dt{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;margin-top:10px}
.rev dd{font-size:13.5px;margin:2px 0 2px}

/* rating */
.rate-row{display:flex;gap:10px;margin:14px 0}
.rate-btn{flex:1;border:2px solid var(--line);border-radius:12px;background:#fff;padding:14px 6px;text-align:center}
.rate-btn.on{border-color:var(--green);background:var(--lime-2)}
.rate-btn .n{font-size:22px;font-weight:800;color:var(--green)}
.rate-btn .t{font-size:11px;color:var(--mut);margin-top:3px}

/* ---------- visualization ---------- */
.viz-controls{display:grid;grid-template-columns:1.1fr 1.1fr .9fr 1fr;gap:12px;margin-bottom:12px}
.trackbar{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 16px;margin-bottom:14px;flex-wrap:wrap}
.trackbar label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.trackbar input{accent-color:var(--green)}
.viz-grid{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.map-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.map-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.map-head h3{font-size:14px;color:var(--green)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.tile{border-radius:8px;padding:8px 7px;min-height:64px;color:#173;position:relative;cursor:pointer;
  border:2px solid transparent;font-size:10.5px;line-height:1.25}
.tile b{display:block;font-size:14px;margin-top:3px}
.tile.sel{border-color:#1c2b26;box-shadow:0 0 0 2px #fff inset}
.tile .lyr{position:absolute;right:4px;top:3px;font-size:10px;letter-spacing:-1px}
.legend{display:flex;gap:10px;margin-top:12px;font-size:11px;color:var(--mut);flex-wrap:wrap;align-items:center}
.lg{display:flex;align-items:center;gap:4px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}
.layerbox{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.layerbox h4{font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.06em;margin-bottom:8px}
.layerbox label{display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-size:12.5px;cursor:pointer}
.layerbox input{accent-color:var(--green)}
.op{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--mut)}
.op input{width:140px;accent-color:var(--green)}

.score-big{font-size:34px;font-weight:800}
.donut{width:110px;height:110px;border-radius:50%;position:relative;flex-shrink:0}
.donut::after{content:'';position:absolute;inset:26px;background:#fff;border-radius:50%}
.dlegend{font-size:11px;color:var(--mut);line-height:1.7}
.dlegend .sw{width:9px;height:9px;border-radius:2px;margin-right:5px}
.bars .brow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px}
.bars .blabel{width:92px;color:var(--mut);flex-shrink:0;text-align:right}
.bars .btrack{flex:1;background:#eef2ee;border-radius:5px;height:16px;overflow:hidden}
.bars .bfill{height:100%;border-radius:5px}
.bars .bval{width:36px;font-weight:700;font-size:11.5px}
.mini-maps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.mini-maps h5{font-size:11px;color:var(--mut);margin-bottom:6px;text-align:center}
.mini-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.mini-tiles div{height:22px;border-radius:4px}
.divg td{font-size:12.5px}

.toast{position:fixed;bottom:24px;right:24px;background:var(--green);color:#fff;padding:14px 20px;
  border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13px;z-index:60}
.overlay{position:fixed;inset:0;background:rgba(10,30,22,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:#fff;border-radius:14px;padding:24px 26px;width:540px;max-height:90vh;overflow:auto}
.modal h3{color:var(--green);margin-bottom:14px}
.modal .grid2{margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:11.5px;background:#fff}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.banner{background:#fff8e6;border:1px solid #f0dfae;border-radius:10px;padding:10px 14px;font-size:12px;
  color:#7a6220;margin-bottom:16px;line-height:1.5}
.banner.green{background:var(--lime-2);border-color:#cde3a8;color:var(--green)}
.vhist{font-size:12.5px}
.vhist .active-v{background:var(--lime-2);border-radius:6px}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="login-card">
    <div class="logo"><div class="logo-badge">RR</div><h1>Risk Radar</h1></div>
    <div class="sub">Climate Vulnerability Assessment Platform — Sri Lanka<br>DS-division level · Hazard × Exposure · 9 provinces</div>
    <label>Email</label><input value="user@riskradar.lk">
    <label>Password</label><input type="password" value="············">
    <label>Sign in as (demo)</label>
    <div class="role-grid">
      <button class="role-btn" onclick="login('admin')"><b>Administrator</b><span>Users, roles &amp; registrations</span></button>
      <button class="role-btn" onclick="login('data')"><b>Data Officer</b><span>Actual factor-wise data</span></button>
      <button class="role-btn" onclick="login('expert')"><b>Expert</b><span>Expert-judgement data</span></button>
      <button class="role-btn" onclick="login('community')"><b>General User</b><span>Rate vulnerabilities (1–5)</span></button>
    </div>
    <button class="guest-btn" onclick="login('guest')">🌍 Explore the map — no login required</button>
    <div class="demo-note">Interactive prototype for GGGI review — no real data is stored.</div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <aside class="side">
    <div class="logo"><div class="logo-badge">RR</div><h1>Risk Radar</h1></div>
    <nav id="nav"></nav>
    <div class="who"><b id="whoName">—</b><span id="whoRole">—</span><br>
      <button onclick="logout()">Switch role</button></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div id="modalHost"></div>
<div id="toastHost"></div>

<script>
/* ===== reference data — generated from FINAL_VARIABLES.xlsx + dsd_register.csv (2026-07-26) ===== */
const PROVINCES = ["Central", "Eastern", "North Central", "Northern", "Northwestern", "Sabaragamuwa", "Southern", "Uva", "Western"];
const DS = {"Central":["Akurana","Deltota","Doluwa","Ganga Ihala Korale","Gangawata Korale","Harispattuwa","Hatharaliyadda","Kundasale","Medadumbara","Minipe","Panvila","Pasbagekorale","Pathadumbara","Pathahewaheta","Poojapitiya","Tumpane","Udapalatha","Ududumbara","Udunuwara","Yatinuwara","Ambanganga","Dambulla","Galewela","Laggala","Matale","Naula","Pallepola","Rattota","Ukuwela","Wilgamuwa","Yatawatta","Ambagamuwa","Hanguranketa","Kothmale","Nuwara Eliya","Walapane"],"Eastern":["Addalaichenai","Akkaraipattu","Alayadivembu","Ampara","Damana","Dehiattakandiya","Irakkamam","Kalmunai","Karaitivu","Lahugala","Mahaoya","Navithanveli","Nintavur","Padiyathalawa","Pottuvil","Sainthamaruthu","Sammanthurai","Tirukkovil","Uhana","Eravur Pattu","Eravur Town","Kattankudy","Koralai Pattu","Koralai Pattu Central","Koralai Pattu North","Koralai Pattu South","Koralai Pattu West","Manmunai North","Manmunai Pattu","Manmunai South & Eruvil Pattu","Manmunai South West","Manmunai West","Porativu Pattu","Gomarankadawala","Kantale","Kinniya","Kuchchaweli","Morawewa","Muthur","Padavi Sri Pura","Seruvila","Thambalagamuwa","Town & Gravets","Verugal"],"North Central":["Galenbidunuwewa","Galnewa","Horowpathana","Ipalogama","Kahatagasdigiliya","Kebithigollewa","Kekirawa","Mahawilachchiya","Medawachchiya","Mihinthale","Nachchaduwa","Nochchiyagama","Nuwaragam Palatha Central","Nuwaragam Palatha East","Padaviya","Palagala","Palugaswewa","Rajanganaya","Rambewa","Thalawa","Thambuththegama","Thirappane","Dimbulagala","Elahera","Higurakgoda","Lankapura","Medirigiriya","Thamankaduwa","Welikanda"],"Northern":["Delft","Islands North (Kayts)","Islands South (Velanai)","Jaffna","Karainagar","Nallur","Thenmaradchi (Chavakachcheri)","Vadamaradchchi East","Vadamaradchchi South-West (Karaveddy)","Vadamaradchi North (Point Pedro)","Valikamam East (Kopay)","Valikamam North (Thllippalai)","Valikamam South (Uduvil)","Valikamam South West (Sandilipay)","Valikamam West (Chankanai)","Kandavalai","Karachchi","Pachchilaipalli","Poonakary","Madhu","Mannar Town","Manthai West","Musali","Nanaddan","Manthai East","Maritimepattu","Oddusuddan","Puthukkudiyiruppu","Thunukkai","Welioya","Vavuniya","Vavuniya North","Vavuniya South","Vengalacheddikulam"],"Northwestern":["Alawwa","Ambanpola","Bamunakotuwa","Bingiriya","Ehetuwewa","Galgamuwa","Ganewatta","Giribawa","Ibbagamuwa","Kobeigane","Kotawehera","Kuliyapitiya East","Kuliyapitiya West","Kurunegala","Maho","Mallawapitiya","Maspotha","Mawathagama","Narammala","Nikaweratiya","Panduwasnuwara East","Panduwasnuwara West","Pannala","Polgahawela","Polpitigama","Rasnayakapura","Rideegama","Udubaddawa","Wariyapola","Weerabugedara","Anamaduwa","Arachchikattuwa","Chilaw","Dankotuwa","Kalpitiya","Karuwalagaswewa","Madampe","Mahakumbukkadawala","Mahawewa","Mundel","Nattandiya","Nawagattegama","Pallama","Puttalam","Vanathavilluwa","Wennappuwa"],"Sabaragamuwa":["Aranayake","Bulathkohipitiya","Dehiowita","Deraniyagala","Galigamuwa","Kegalle","Mawanella","Rambukkana","Ruwanwella","Warakapola","Yatiyantota","Ayagama","Balangoda","Eheliyagoda","Elapatha","Embilipitiya","Godakawela","Imbulpe","Kahawattha","Kalawana","Kiriella","Kolonna","Kuruvita","Nivithigala","Opanayake","Pelmadulla","Ratnapura","Weligepola"],"Southern":["Akmeemana","Ambalangoda","Baddegama","Balapitiya","Bentota","Bope-Poddala","Elpitiya","Galle4Gravets","Gonapinuwala","Habaraduwa","Hikkaduwa","Imaduwa","Karandeniya","Nagoda","Neluwa","Niyagama","Thawalama","Welivitiya-Divitura","Yakkalamulla","Ambalantota","Angunakolapelessa","Beliatta","Hambantota","Katuwana","Lunugamwehera","Okewela","Sooriyawewa","Tangalle","Thissamaharama","Walasmulla","Weeraketiya","Akuressa","Athuraliya","Devinuwara","Dikwella","Hakmana","Kaburupitiya","Kirinda Puhulwella","Kotapola","Malimbada","Matara Four Gravets","Mulatiyana","Pasgoda","Pitabaddara","Thihagoda","Weligama","Welipitiya"],"Uva":["Badulla","Bandarawela","Ella","Haldummulla","Hali-Ela","Haputale","Kandeketiya","Lunugala","Mahiyanganaya","Meegahakiula","Passara","Rideemaliyadda","Soranathota","Uvaparanagama","Welimada","Badalkumbura","Bibile","Buttala","Katharagama","Madulla","Medagama","Monaragala","Sevanagala","Siyambalanduwa","Thanamalwila","Wellawaya"],"Western":["Colombo","Dehiwala","Homagama","Kaduwela","Kesbewa","Kolonnawa","Maharagama","Moratuwa","Padukka","Ratmalana","Seethawaka","Sri Jayawardanapura Kotte","Thimbirigasyaya","Attanagalla","Biyagama","Divulapitiya","Dompe","Gampaha","Ja Ela","Katana","Kelaniya","Mahara","Minuwangoda","Mirigama","Negombo","Wattala","Agalawatta","Bandaragama","Beruwala","Bulathsinhala","Dodangoda","Horana","Ingiriya","Kalutara","Madurawala","Matugama","Millaniya","Palindanuwara","Panadura","Walallawita"]};
const SECTORS = {"Agriculture Sector":["Coconut","Paddy","Tea","Vegetable & Other Field Crops"],"Human Settlements Sector":[],"Industry Sector":[],"Inland Fishery Sector":["Inland Fishery"],"Livestock Sector":["Buffalo Farming","Cattle Farming","Goat Farming","Pig and Sheep Farming","Poultry Farming"],"Tourism Sector":[],"Transportation Sector":[],"Water Sector":["Irrigation Water","Potable Water"]};

function hash(s){let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return (h%1000)/1000;}
const clamp=x=>Math.max(.03,Math.min(.97,x));
function vval(ds,track){
  const base=hash(ds+viz.sector+viz.sub+viz.hazard);
  if(track==='data')return base;
  if(track==='expert')return clamp(base+(hash('e'+ds+viz.hazard)-.5)*.28);
  return clamp(base+(hash('c'+ds+viz.sector)-.5)*.5);
}

/* ================= data-entry wizard =================
   Weights flow (decided 2026-07-26, simplified for V1):
     • Officer uploads the workbook FIRST; the importer reads its WEIGHTS tab.
     • Weights arrive pre-filled and stay EDITABLE on every upload.
     • Saving takes effect IMMEDIATELY — no in-app approval gate. Data is
       verified against a local expert panel offline; record that sign-off in
       the panel note. Officers, experts and admins may all save.
     • Every save is kept as a version so past scores remain explainable.
     • The Excel WEIGHTS tab is reference-only; this screen is the master. */
function stepsFor(){
  if(wiz.track==='community')return ['Context','Your rating','Review & submit'];
  if(wiz.track==='data')return ['Context','Upload workbook','Confirm weights','Review & submit'];
  return ['Context','Parameters & weights','Data input','Review & submit'];
}
function rWizard(){
  const labels=stepsFor(),s=wiz.step;
  M(`<div class="crumb">Data import</div>
  <div class="page-h"><h2>New data entry</h2>
    <span class="badge ${ROLE_META[role].badge}">${TRACKS[wiz.track]||''}</span></div>
  <div class="steps">${labels.map((t,i)=>
      `<div class="step ${s===i+1?'on':''} ${s>i+1?'done':''}" data-n="${i+1}">${t}</div>`).join('')}</div>
  <div id="wbody"></div>`);
  if(wiz.track==='community')      [null,step1,stepRate,step4][s]();
  else if(wiz.track==='data')      [null,step1,stepUpload,stepWeights,step4][s]();
  else                             [null,step1,step2,step3,step4][s]();
}

/* ---- step 1: context ---- */
function step1(){
  document.getElementById('wbody').innerHTML=`
  <div class="panel"><h3>1 · Data type</h3>
    <div class="pills">${Object.entries(TRACKS).map(([k,v])=>
      `<button class="pill ${wiz.track===k?'on':''}" ${role!=='data'&&k!==wiz.track?'disabled style="opacity:.4"':''}
        onclick="wiz.track='${k}';wiz.step=1;wiz.params=null;rWizard()">${v}</button>`).join('')}</div>
    <div class="hint">${role==='data'?'Data Officers may enter all three data types.':'Your role is limited to this data type.'}
    All entries carry your user ID and provenance tag.</div></div>
  <div class="panel"><h3>2 · Location &amp; sector</h3>
    <div class="grid3">
      <div class="field"><label>Province</label><select onchange="wiz.province=this.value;wiz.ds='';wiz.params=null;rWizard()">
        <option value="">— select —</option>${PROVINCES.map(p=>`<option ${wiz.province===p?'selected':''}>${p}</option>`).join('')}</select></div>
      <div class="field"><label>Sector</label><select onchange="wiz.sector=this.value;wiz.sub='';wiz.params=null;rWizard()">
        <option value="">— select —</option>${Object.keys(SECTORS).map(x=>`<option ${wiz.sector===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label>Subsector</label><select ${((SECTORS[wiz.sector]||[]).length)?'':'disabled'}
          onchange="wiz.sub=this.value;wiz.params=null;rWizard()">
        <option value="">— whole sector —</option>${(SECTORS[wiz.sector]||[]).map(x=>`<option ${wiz.sub===x?'selected':''}>${x}</option>`).join('')}</select></div>
    </div>
    <div class="grid3" style="margin-top:12px">
      <div class="field"><label>Hazard type</label><select onchange="wiz.hazard=this.value;wiz.params=null;rWizard()">
        <option value="">— select —</option>${HAZARDS.map(h=>`<option ${wiz.hazard===h?'selected':''}>${h}</option>`).join('')}</select></div>
      <div class="field"><label>Data period</label><select onchange="wiz.period=this.value">
        ${['2020-2025','2025-2030'].map(p=>`<option ${wiz.period===p?'selected':''}>${p}</option>`).join('')}</select></div>
      <div class="field"><label>DS division${wiz.track==='data'?' (whole province on import)':''}</label>
        <select id="selDs" ${wiz.province&&wiz.track!=='data'?'':'disabled'} onchange="wiz.ds=this.value">
        ${wiz.track==='data'
          ?`<option>All ${(DS[wiz.province]||[]).length} divisions of ${wiz.province||'—'}</option>`
          :`<option value="">— select —</option>`+(DS[wiz.province]||[]).map(d=>`<option ${wiz.ds===d?'selected':''}>${d}</option>`).join('')}
        </select></div>
    </div>
    ${profileNote()}</div>
  <div class="wnav"><span></span><button class="btn" onclick="toStep2()">Next →</button></div>`;
}
function profileNote(){
  if(!wiz.province||!wiz.sector||!wiz.hazard)return `<div class="hint">Select province, sector and hazard to load the vulnerability profile.</div>`;
  const k=pkey(wiz.sector,wiz.sub,wiz.hazard,wiz.province);
  const p=PROFILES[k];
  if(!p)return `<div class="banner">⚠ <b>No profile defined</b> for ${wiz.sector}${wiz.sub?' · '+wiz.sub:''} × ${wiz.hazard} in ${wiz.province}.
    This combination was not part of the expert-refined catalogue. Contact an administrator before entering data.</div>`;
  const n=p.h.length+p.e.length, miss=[...p.h,...p.e].filter(r=>r[1]===null).length;
  return `<div class="hint">Profile <b>${esc(k)}</b> — ${n} variables (${p.h.length} hazard + ${p.e.length} exposure)
    across ${(DS[wiz.province]||[]).length} DS divisions.
    ${miss?`<b style="color:var(--amber)">${miss} variable${miss>1?'s have':' has'} no weight yet</b> — you'll set them on the weights step.`
          :'All variables already carry a weight.'}</div>`;
}
function toStep2(){
  const d=document.getElementById('selDs');
  if(wiz.track==='data') wiz.ds=`All ${(DS[wiz.province]||[]).length} divisions`;
  else if(d&&d.value) wiz.ds=d.value;
  if(!wiz.track||!wiz.province||!wiz.sector||!wiz.hazard){toast('Select data type, province, sector and hazard.');return;}
  if(wiz.track!=='data'&&!wiz.ds){toast('Select a DS division.');return;}
  if(!PROFILES[pkey(wiz.sector,wiz.sub,wiz.hazard,wiz.province)]){toast('No profile exists for this combination.');return;}
  if(wiz.track!=='community'&&!wiz.params)loadProfile();
  wiz.step=2;rWizard();
}
function loadProfile(){
  const p=PROFILES[pkey(wiz.sector,wiz.sub,wiz.hazard,wiz.province)];
  const lock=wiz.track==='expert';
  const mk=g=>p[g].map(r=>({code:r[0],label:VARS[r[0]],w:r[1],w0:r[1],rel:REL[r[2]],
                            locked:lock,fromFile:false,isNew:r[1]===null}));
  wiz.params={hazard:mk('h'),exposure:mk('e')};
}

/* ---- step 2 (data officer): upload the workbook ---- */
function stepUpload(){
  const nds=(DS[wiz.province]||[]).length;
  const fname=`${(wiz.sub||wiz.sector).toUpperCase().replace(/[^A-Z0-9]+/g,'_').replace(/_SECTOR|_FARMING/,'')}_${wiz.hazard.toUpperCase()}_${wiz.province.slice(0,3).toUpperCase()}_V1_upload_template.xlsx`;
  document.getElementById('wbody').innerHTML=`
  <div class="banner">Upload the completed workbook first. The importer reads its <b>WEIGHTS</b> tab and pre-fills
    the next step, where you confirm or adjust every weight before saving.
    The workbook's weights are <b>reference only</b> — what you confirm in the app is what the system stores.</div>
  <div class="panel"><h3>Excel import — ${esc(wiz.sector)}${wiz.sub?' · '+esc(wiz.sub):''} × ${esc(wiz.hazard)} — ${esc(wiz.province)} Province</h3>
    <button class="btn ghost sm" onclick="toast('Template downloaded — ${nds} DS divisions, 2 period tabs')">⬇ Download blank template</button>
    <div class="drop" onclick="mockUpload()">${wiz.file
      ? `<b>${esc(wiz.file)}</b><br>✓ ${nds} DS divisions matched · ${wiz.readStat.total} variables ·
         ${wiz.readStat.withW} weights read from the WEIGHTS tab · ${wiz.readStat.blank} still blank · 0 structural errors`
      : `Drop the completed <b>.xlsx</b> here or <b>click to browse</b><br>
         <span style="font-size:11.5px">Expected: <code>${esc(fname)}</code> — raw values only, the system normalises</span>`}</div>
    <div class="hint">The importer validates the sheet structure against the profile's expected column list
      (hidden <code>_META</code> tab) before anything is read. Files with added, removed or reordered columns are rejected.</div></div>
  <div class="wnav">
    <button class="btn ghost" onclick="wiz.step=1;rWizard()">← Back</button>
    <button class="btn" ${wiz.file?'':'disabled'} onclick="wiz.step=3;rWizard()">Next: confirm weights →</button></div>`;
}
function mockUpload(){
  loadProfile();
  /* simulate reading the workbook's WEIGHTS tab: legacy weights come through, new variables stay blank */
  let withW=0,blank=0;
  for(const g of ['hazard','exposure'])for(const p of wiz.params[g]){
    if(p.w0!==null){p.fromFile=true;withW++;} else {blank++;}
  }
  wiz.readStat={total:withW+blank,withW,blank};
  wiz.file=`${(wiz.sub||wiz.sector).replace(/[^A-Za-z0-9]+/g,'_')}_${wiz.hazard}_${wiz.province.slice(0,3).toUpperCase()}.xlsx`;
  rWizard();
}

/* ---- step 3 (data officer): confirm weights ---- */
function stepWeights(){
  document.getElementById('wbody').innerHTML=`
  <div class="banner">Read from <b>${esc(wiz.file)}</b>. Weights shaded <span class="badge b-expert">blue</span> are
    <b>new variables</b> with no weight in the workbook — they must be set before you can submit.
    Each group must total <b>100%</b>. Saving <b>takes effect immediately</b> and is kept as a new version,
    so earlier results stay explainable. You can edit these again at any time from <b>Profile weights</b>.</div>
  <div class="panel" style="padding:14px 20px"><div class="field">
    <label>Expert-panel sign-off (optional)</label>
    <input placeholder="e.g. Approved by Central expert panel, 14 July 2026"
           value="${esc(wiz.panelNote||'')}" onchange="wiz.panelNote=this.value">
    <div class="hint">Panel review happens outside the system — note it here so the weighting carries its provenance.</div>
  </div></div>
  ${wTable('hazard','Hazard weights')}
  ${wTable('exposure','Exposure weights')}
  <div class="wnav">
    <button class="btn ghost" onclick="wiz.step=2;rWizard()">← Back</button>
    <div style="display:flex;gap:8px">
      <button class="btn ghost" onclick="mockUpload();wiz.step=3;rWizard();toast('Reset to the values in the workbook')">↺ Reset to file</button>
      <button class="btn" id="toRev" onclick="wiz.step=4;rWizard()">Next: review →</button>
    </div></div>`;
  refreshTotals();
}
function wTable(g,title){
  const rows=wiz.params[g].map((p,i)=>{
    const tag = p.isNew&&p.w===null ? `<span class="badge b-expert">new — needs weight</span>`
              : (p.w!==p.w0 ? `<span class="badge b-pend">edited</span>`
              : (p.fromFile&&p.w0!==null ? `<span class="badge b-ok">from file</span>`:''));
    return `<tr ${p.isNew&&p.w===null?'style="background:#eef6fd"':''}>
    <td style="width:280px"><b style="font-size:11.5px">${esc(p.code)}</b></td>
    <td>${esc(p.label)} ${tag}</td>
    <td style="width:96px"><input type="number" min="0" max="100" step="0.5" value="${p.w===null?'':p.w}"
        placeholder="—" onchange="wiz.params['${g}'][${i}].w=this.value===''?null:+this.value;rWizard()"> %</td>
    <td style="width:140px"><select onchange="wiz.params['${g}'][${i}].rel=this.value">
        <option value="+" ${p.rel==='+'?'selected':''}>+ raises vulnerability</option>
        <option value="-" ${p.rel==='-'?'selected':''}>− lowers vulnerability</option></select></td></tr>`;}).join('');
  return `<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <h3 style="margin:0">${title}</h3><span class="wsum" id="sum-${g}">Σ 0%</span></div>
    <table class="ptable"><tr><th>Variable code</th><th>Variable</th><th>Weight</th><th>Relationship</th></tr>${rows}</table></div>`;
}
function refreshTotals(){
  let allOk=true;
  for(const g of ['hazard','exposure']){
    const arr=wiz.params[g];
    const t=Math.round(arr.reduce((a,p)=>a+(+p.w||0),0)*100)/100;
    const miss=arr.filter(p=>p.w===null).length;
    const ok=t===100&&arr.length>0&&miss===0;
    const el=document.getElementById('sum-'+g);
    if(el){el.textContent=miss?`Σ ${t}% — ${miss} weight${miss>1?'s':''} still blank`
                              :`Σ ${t}% ${ok?'✓':'— must equal 100%'}`;
           el.className='wsum '+(ok?'ok':'bad');}
    if(!ok)allOk=false;
  }
  const b=document.getElementById('toRev')||document.getElementById('toStep3');
  if(b)b.disabled=!allOk;
}

/* ---- step 2 (expert): parameters & weights ---- */
function step2(){
  document.getElementById('wbody').innerHTML=`
  <div class="banner">The actual-data profile for <b>${esc(wiz.sector)} × ${esc(wiz.hazard)}</b> defines the mandatory
    variables (🔒). You may adjust weights and add variables from your expertise. Weights are renormalised on submission;
    expert-added variables enter the published expert mean once <b>≥ 2 experts</b> include them.</div>
  ${pTable('hazard','Hazard parameters')}
  ${pTable('exposure','Exposure parameters')}
  <div class="wnav">
    <button class="btn ghost" onclick="wiz.step=1;rWizard()">← Back</button>
    <div style="display:flex;gap:8px">
      <button class="btn ghost" onclick="loadProfile();rWizard();toast('Default parameter set restored')">Restore defaults</button>
      <button class="btn" id="toStep3" onclick="wiz.step=3;rWizard()">Next: data input →</button>
    </div></div>`;
  refreshTotals();
}
function pTable(g,title){
  const rows=wiz.params[g].map((p,i)=>`<tr>
    <td style="width:260px"><b style="font-size:11.5px">${esc(p.code)}</b></td>
    <td>${esc(p.label)}${p.added?' <span class="badge b-expert">added</span>':''}</td>
    <td style="width:96px"><input type="number" min="0" max="100" step="0.5" value="${p.w===null?'':p.w}" placeholder="—"
        onchange="wiz.params['${g}'][${i}].w=this.value===''?null:+this.value;refreshTotals()"> %</td>
    <td style="width:140px"><select onchange="wiz.params['${g}'][${i}].rel=this.value">
        <option value="+" ${p.rel==='+'?'selected':''}>+ raises</option>
        <option value="-" ${p.rel==='-'?'selected':''}>− lowers</option></select></td>
    <td style="width:36px">${p.locked&&!p.added?'<span class="lock" title="Mandatory — defined by the actual data profile">🔒</span>'
      :`<button class="del" title="Remove" onclick="wiz.params['${g}'].splice(${i},1);rWizard()">✕</button>`}</td>
  </tr>`).join('');
  return `<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <h3 style="margin:0">${title}</h3><span class="wsum" id="sum-${g}">Σ 0%</span></div>
    <table class="ptable"><tr><th>Variable code</th><th>Variable</th><th>Weight</th><th>Relationship</th><th></th></tr>${rows}</table>
    <div class="addrow"><input id="add-${g}" placeholder="Add a variable from your expertise" style="flex:1">
      <input id="addw-${g}" type="number" placeholder="wt %" style="width:80px">
      <button class="btn sm ghost" onclick="addParam('${g}')">+ Add</button></div></div>`;
}
function addParam(g){
  const el=document.getElementById('add-'+g),l=(el.value||'').trim();
  if(!l){toast('Enter a variable name first.');return;}
  const w=+document.getElementById('addw-'+g).value||0;
  wiz.params[g].push({code:'EXPERT_'+(g==='hazard'?'H':'E')+(wiz.params[g].length+1),
    label:l,w,w0:null,rel:'+',locked:false,added:true});
  rWizard();
}

function stepRate(){

    ${esc(wiz.sector.toLowerCase())} in ${esc(wiz.ds)}?</h3>
    <div class="rate-row">${RATE_T.map((t,i)=>`<button class="rate-btn ${wiz.rating===i+1?'on':''}"

/* ================= profile weights (edit any time) =================
   V1: no approval gate. Expert-panel review happens offline; whoever holds the
   sign-off edits here and saves. Every save is versioned so past vulnerability
   results stay explainable. */
function saveWeights(sector,sub,hazard,province,params,file,note){
  const K=pkey(sector,sub,hazard,province);
  if(PROFILES[K]){
    PROFILES[K].h=params.hazard.map(x=>[x.code,x.w,x.rel==='+'?0:1]);
    PROFILES[K].e=params.exposure.map(x=>[x.code,x.w,x.rel==='+'?0:1]);
  }
  const v=(WEIGHT_LOG.filter(l=>l.profile===K).length)+2;   // v1 = seeded catalogue
  WEIGHT_LOG.unshift({profile:K,province,sector,sub,hazard,version:v,
    by:ROLE_META[role].name,d:new Date().toISOString().slice(0,10),
    file:file||'—',note:note||'',
    n:params.hazard.length+params.exposure.length,
    params:JSON.parse(JSON.stringify(params))});
  return v;
}
function rWeights(){
  if(!wt.province)wt.province=PROVINCES[0];
  if(!wt.sector)  wt.sector=Object.keys(SECTORS)[0];
  const subs=SECTORS[wt.sector]||[];
  if(subs.length&&!subs.includes(wt.sub))wt.sub=subs[0];
  if(!subs.length)wt.sub="";
  if(!hasProfile(wt.sector,wt.sub,wt.hazard,wt.province)){
    const alt=HAZARDS.find(h=>hasProfile(wt.sector,wt.sub,h,wt.province));
    wt.hazard=alt||wt.hazard;
  }
  const K=pkey(wt.sector,wt.sub,wt.hazard,wt.province), P=PROFILES[K];
  if(P&&!wt.params)loadWt(K);
  const hist=WEIGHT_LOG.filter(l=>l.profile===K);
  M(`<div class="crumb">Data import</div>
  <div class="page-h"><h2>Profile weights</h2>
    ${P?`<span class="badge b-ok">${hist.length?'v'+(hist.length+1):'v1 — as catalogued'}</span>`:''}</div>
  <div class="banner">Edit the weighting for any sector × hazard × province and save.
    <b>Saving takes effect immediately</b> — there is no approval step in the system.
    Expert-panel review happens outside it; note the sign-off below so the weighting carries its provenance.
    Each save is kept as a version, so scores already published stay explainable.</div>
  <div class="panel"><div class="grid3">
    <div class="field"><label>Province</label><select onchange="wt.province=this.value;wt.params=null;rWeights()">
      ${PROVINCES.map(p=>`<option ${wt.province===p?'selected':''}>${p}</option>`).join('')}</select></div>
    <div class="field"><label>Sector</label><select onchange="wt.sector=this.value;wt.sub='';wt.params=null;rWeights()">
      ${Object.keys(SECTORS).map(x=>`<option ${wt.sector===x?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="field"><label>Subsector</label><select ${subs.length?'':'disabled'}
        onchange="wt.sub=this.value;wt.params=null;rWeights()">
      <option value="">— whole sector —</option>${subs.map(x=>`<option ${wt.sub===x?'selected':''}>${x}</option>`).join('')}</select></div>
  </div>
  <div class="grid3" style="margin-top:12px">
    <div class="field"><label>Hazard</label><select onchange="wt.hazard=this.value;wt.params=null;rWeights()">
      ${HAZARDS.map(h=>`<option ${wt.hazard===h?'selected':''}>${h}</option>`).join('')}</select></div>
    <div class="field" style="grid-column:span 2"><label>Expert-panel sign-off (optional)</label>
      <input placeholder="e.g. Approved by Central expert panel, 14 July 2026"
             value="${esc(wt.note||'')}" onchange="wt.note=this.value"></div>
  </div></div>
  <div id="wtBody"></div>`);
  const b=document.getElementById('wtBody');
  if(!P){b.innerHTML=`<div class="banner">⚠ No profile defined for this combination.</div>`;return;}
  b.innerHTML=`${wtTable('hazard','Hazard weights')}${wtTable('exposure','Exposure weights')}
    <div class="wnav">
      <button class="btn ghost" onclick="loadWt('${K}');rWeights();toast('Reverted to the saved weighting')">↺ Revert</button>
      <button class="btn" id="wtSave" onclick="doSaveWeights()">✓ Save weights</button></div>
    <div class="panel"><h3>Change history</h3>${hist.length?`<table>
      <tr><th>Version</th><th>Saved by</th><th>Date</th><th>Source file</th><th>Panel sign-off</th><th>Variables</th></tr>
      ${hist.map(l=>`<tr><td><b>v${l.version}</b></td><td>${esc(l.by)}</td><td>${l.d}</td>
        <td style="font-size:11.5px">${esc(l.file)}</td>
        <td>${esc(l.note)||'<span style="color:var(--mut)">—</span>'}</td><td>${l.n}</td></tr>`).join('')}
      </table>`:`<div style="color:var(--mut);padding:8px 0">No changes yet — this is the weighting as catalogued (v1).</div>`}
    </div>`;
  refreshWtTotals();
}
function loadWt(K){
  const P=PROFILES[K];
  const mk=g=>P[g].map(r=>({code:r[0],label:VARS[r[0]],w:r[1],w0:r[1],rel:REL[r[2]],isNew:r[1]===null}));
  wt.params={hazard:mk('h'),exposure:mk('e')};
}
function wtTable(g,title){
  const rows=wt.params[g].map((p,i)=>{
    const tag=p.isNew&&p.w===null?`<span class="badge b-expert">no weight yet</span>`
             :(p.w!==p.w0?`<span class="badge b-pend">edited</span>`:'');
    return `<tr ${p.isNew&&p.w===null?'style="background:#eef6fd"':''}>
      <td style="width:280px"><b style="font-size:11.5px">${esc(p.code)}</b></td>
      <td>${esc(p.label)} ${tag}</td>
      <td style="width:96px"><input type="number" min="0" max="100" step="0.5" value="${p.w===null?'':p.w}"
          placeholder="—" onchange="wt.params['${g}'][${i}].w=this.value===''?null:+this.value;rWeights()"> %</td>
      <td style="width:150px"><select onchange="wt.params['${g}'][${i}].rel=this.value">
          <option value="+" ${p.rel==='+'?'selected':''}>+ raises vulnerability</option>
          <option value="-" ${p.rel==='-'?'selected':''}>− lowers vulnerability</option></select></td></tr>`;}).join('');
  return `<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <h3 style="margin:0">${title}</h3><span class="wsum" id="wsum-${g}">Σ 0%</span></div>
    <table class="ptable"><tr><th>Variable code</th><th>Variable</th><th>Weight</th><th>Relationship</th></tr>${rows}</table></div>`;
}
function refreshWtTotals(){
  let ok=true;
  for(const g of ['hazard','exposure']){
    const a=wt.params[g], t=Math.round(a.reduce((s,p)=>s+(+p.w||0),0)*100)/100;
    const miss=a.filter(p=>p.w===null).length, good=t===100&&a.length>0&&miss===0;
    const el=document.getElementById('wsum-'+g);
    if(el){el.textContent=miss?`Σ ${t}% — ${miss} weight${miss>1?'s':''} still blank`
                              :`Σ ${t}% ${good?'✓':'— must equal 100%'}`;
           el.className='wsum '+(good?'ok':'bad');}
    if(!good)ok=false;
  }
  const b=document.getElementById('wtSave'); if(b)b.disabled=!ok;
}
function doSaveWeights(){
  const v=saveWeights(wt.sector,wt.sub,wt.hazard,wt.province,wt.params,'edited in app',wt.note);
  toast(`Weights saved as v${v} — vulnerability recomputed for ${wt.province}.`);
  wt.params=null; rWeights();
}

function vizSingle(){

const DCOLORS=["#00563F","#0b7a5c","#8CC63F","#5b8c3f","#b7791f","#2b6cb0","#7a5195","#bc5090","#ef5675","#ffa600","#488f31","#de425b"];
function donut(t,pairs){

      ${pairs.map((x,i)=>`<span class="sw" style="background:${DCOLORS[i%DCOLORS.length]}"></span>${x[0]} — ${x[1]}%`).join('<br>')}</div></div>`;

    <div class="panel" style="margin-top:16px;margin-bottom:0"><h3>Largest divergence between tracks</h3>
      <table class="divg"><tr><th>DS division</th><th>Actual</th><th>Expert</th><th>Gen. users</th><th>Max gap</th></tr>
      ${rows.map(r=>`<tr><td><b>${r.d}</b></td><td>${r.a.toFixed(2)}</td><td>${r.e.toFixed(2)}</td>
        <td>${r.c.toFixed(2)}</td><td><span class="badge ${r.g>.25?'b-pend':'b-ok'}">${r.g.toFixed(2)}</span></td></tr>`).join('')}
      </table><div class="hint">Where expert or community scores diverge from actual data, decision-makers should
      investigate: a perception gap, or missing/outdated data.</div></div></div>`;
}
</script>
</body>
