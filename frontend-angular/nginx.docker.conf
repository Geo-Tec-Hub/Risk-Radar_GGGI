# nginx inside the frontend container: serve the app, pass /api to the API.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;          # workbook uploads

    gzip on;
    gzip_types application/json application/javascript text/css;

    # Resolve "api" per request via Docker's DNS: a plain "proxy_pass
    # http://api:8000" is looked up once at start, so every rebuild of the API
    # container (new IP) left the site on 502 until web was restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;        # province recompute can take a while
    }

    location / {
        try_files $uri $uri/ /index.html;   # Angular routes (/map, /import ...)
    }
}
