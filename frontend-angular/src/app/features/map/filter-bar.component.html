<form class="filter-bar" (submit)="$event.preventDefault()">
  @if (taxonomyError()) {
    <p class="filter-bar__error" role="status">
      Filter options could not be loaded, so no selection can be offered yet.
      {{ taxonomyError() }}
    </p>
  }

  <label class="filter-bar__field">
    <span>Province</span>
    <select [ngModel]="province()" name="province" (ngModelChange)="onProvinceChange($event)">
      @for (p of provinces(); track p.code) {
        <option [ngValue]="p.code">{{ p.name }}</option>
      }
    </select>
  </label>

  <label class="filter-bar__field">
    <span>Sector</span>
    <select [ngModel]="sector()" name="sector" (ngModelChange)="onSectorChange($event)">
      @for (s of sectors(); track s.code) {
        <option [ngValue]="s.code">{{ s.name }}</option>
      }
    </select>
  </label>

  <label class="filter-bar__field">
    <span>Subsector</span>
    <select
      [ngModel]="subsector()"
      name="subsector"
      [disabled]="subsectorOptions().length === 0"
      (ngModelChange)="onSubsectorChange($event)"
    >
      @for (s of subsectorOptions(); track s.code) {
        <option [ngValue]="s.code">{{ s.name }}</option>
      }
    </select>
  </label>

  <label class="filter-bar__field">
    <span>Hazard</span>
    <select [ngModel]="hazard()" name="hazard" (ngModelChange)="hazard.set($event); onFieldChange()">
      @for (h of hazards(); track h.code) {
        <option [ngValue]="h.code">{{ h.name }}</option>
      }
    </select>
  </label>

  <label class="filter-bar__field">
    <span>Map layer</span>
    <select [ngModel]="layer()" name="layer" (ngModelChange)="onLayerChange($event)">
      @for (l of layers; track l) {
        <option [ngValue]="l">{{ layerLabel[l] }}</option>
      }
    </select>
  </label>

  <label class="filter-bar__field">
    <span>Track</span>
    <select [ngModel]="track()" name="track" (ngModelChange)="track.set($event); onFieldChange()">
      @for (t of tracks; track t) {
        <option [ngValue]="t">{{ trackLabel(t) }}</option>
      }
    </select>
  </label>

  <label class="filter-bar__field">
    <span>Period</span>
    <select [ngModel]="period()" name="period" (ngModelChange)="period.set($event); onFieldChange()">
      @for (p of periods(); track p) {
        <option [ngValue]="p">{{ p }}</option>
      }
    </select>
  </label>

  <label class="filter-bar__field" [title]="'Provincial is the published score. ' + nationalScopeDisabledReason()">
    <!-- The full explanation used to sit under the select in red and took a
         lot of room. It now lives in a tooltip on the small (i) beside the
         label, with a short grey hint, so the disabled National option is
         still explained without crowding the filter bar. -->
    <span class="filter-bar__label-row">
      Index scope
      <span class="filter-bar__info" aria-label="About index scope">ⓘ</span>
      <span class="filter-bar__inline-note">national pending</span>
    </span>
    <select [ngModel]="indexScope()" name="indexScope" (ngModelChange)="indexScope.set($event); onFieldChange()">
      <option [ngValue]="'provincial'">Provincial (published score)</option>
      <option [ngValue]="'national'" disabled>National (unavailable)</option>
    </select>
  </label>
</form>
