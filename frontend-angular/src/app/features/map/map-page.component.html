<div class="map-page">
  <app-filter-bar (queryChange)="onQueryChange($event)" />

  @if (resultsError(); as message) {
    <div class="map-page__banner" role="alert">
      Results are unavailable ({{ message }}). Every division is shown as unassessed until this recovers.
    </div>
  }

  <div class="map-page__body">
    <div class="map-page__map">
      <!-- The legend sits ON the map, not beside it. It describes what the
           colours mean, so reading it means looking away from the thing it
           explains when it lives in the sidebar - and on a laptop the sidebar
           scrolls, which could put it out of sight entirely while the map it
           describes stayed on screen. -->
      <app-coverage-legend
        class="map-page__legend"
        [coverage]="coverage()"
        [indexScope]="query().indexScope ?? 'provincial'"
      />
      <app-openlayers-map
        [unitsByCode]="unitsByCode()"
        [selectedCode]="selectedDivision()?.ds_code ?? null"
        [provinceName]="provinceName()"
        (divisionSelected)="onDivisionSelected($event)"
        (boundariesLoaded)="onBoundariesLoaded($event)"
        (boundariesFailed)="onBoundariesFailed($event)"
      />
    </div>

    <div
      class="map-page__resize-handle"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize division panel"
      (pointerdown)="onSidebarResizeStart($event)"
      (pointermove)="onSidebarResizeMove($event)"
      (pointerup)="onSidebarResizeEnd($event)"
      (pointercancel)="onSidebarResizeEnd($event)"
    ></div>

    <aside class="map-page__sidebar" [style.width.px]="sidebarWidth()">
      <app-division-panel [division]="selectedDivision()" [query]="query()" />
    </aside>
  </div>
</div>
