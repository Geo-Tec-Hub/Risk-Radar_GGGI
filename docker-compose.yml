# Risk Radar -- the whole app in Docker (database + API + website).
#
#   docker compose up -d --build     build and start everything
#   open http://localhost:8080       the website
#   docker compose logs -f api       watch the API
#   docker compose down              stop (data is kept)
#   docker compose down -v           stop AND wipe the database
#
# See DOCKER.md for loading your existing data.
# The database is on port 5433 so it does not clash with a PostgreSQL already
# running on 5432 on this computer.

services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64          # no Apple-chip image yet; Docker runs it via Rosetta
    environment:
      POSTGRES_DB: riskradar
      POSTGRES_USER: riskradar
      POSTGRES_PASSWORD: riskradar_dev_only   # local development only
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskradar -d riskradar"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: riskradar
      PGUSER: riskradar
      PGPASSWORD: riskradar_dev_only
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend-angular
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
