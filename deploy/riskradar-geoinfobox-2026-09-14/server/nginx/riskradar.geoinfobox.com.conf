# Risk Radar — nginx site for riskradar.geoinfobox.com
#
# One origin serves both halves: the Angular files and the API. That is not a
# convenience, it is what the build assumes -- the frontend calls the API at the
# RELATIVE path /api (src/environments/environment.ts), so no API hostname is
# compiled into the bundle and nothing needs rebuilding per environment. Serving
# the API from a different host would also turn every request cross-origin and
# put the session cookie behind SameSite rules it is not configured for.

server {
    listen 80;
    listen [::]:80;
    server_name riskradar.geoinfobox.com;

    # ACME http-01 challenge, if certbot is used in webroot mode.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name riskradar.geoinfobox.com;

    ssl_certificate     /etc/letsencrypt/live/riskradar.geoinfobox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/riskradar.geoinfobox.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # No X-Frame-Options DENY: nothing here is framed today, but if the platform
    # is ever embedded in a ministry portal this is the line to revisit.

    root /var/www/riskradar/frontend;
    index index.html;

    # ---- the API -----------------------------------------------------------
    # Note the trailing slash on neither side: the app's own routes already
    # begin /api (app/main.py mounts them there), so the path is passed through
    # unchanged rather than stripped.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Workbook uploads. The API refuses anything over 20 MB itself
        # (MAX_BYTES in app/routers/imports.py); nginx's default is 1 MB, which
        # would reject a normal template with a bare 413 before the API ever
        # saw it and could explain why.
        client_max_body_size 25m;

        # A province-wide import parses every sheet with openpyxl and can sit
        # well past the 60s default while it does. The API is the thing that
        # decides an import has failed, not the proxy.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
    }

    # ---- the Angular app ---------------------------------------------------
    # Hashed filenames (outputHashing: all), so they can be cached hard and
    # forever. index.html must NOT be, or a deploy lands for nobody.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: /map, /import, /weights are Angular routes, not files. A
    # plain 404 here is what makes a refresh on any deep link fail.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/riskradar.access.log;
    error_log  /var/log/nginx/riskradar.error.log;
}
